name: Release signed APK

# Push a tag like v1.0.0 to build a formally signed release APK
# and publish it as a GitHub Release.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    - base64 of the release keystore file
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
# The keystore itself is never committed (see android/.gitignore).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$PWD/android/app/release.jks
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          "$JAVA_HOME/bin/keytool" -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -8
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
